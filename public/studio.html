<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استوديو التصميم • منشوراتي (Manchorati)</title>
    <meta name="description" content="صمم أجمل بطاقات الاقتباسات والخواطر والستوريات لإنستغرام وواتساب عبر استوديو منشوراتي الإبداعي مجاناً.">
    <link rel="icon" href="assets/icon.png" type="image/png">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <style>
/* ==========================================================================
   منشوراتي (MANCHORATI) - STYLESHEET
   الهوية الرسمية لتطبيق منشوراتي المستوحاة من نظام أندرويد (تطابق 100%)
   ========================================================================== */

:root {
    /* الألوان الرسمية من colors.xml في تطبيق منشوراتي */
    --bg-main: #0B131F;
    --bg-card: #141E2E;
    --bg-surface: #1E2A3A;
    --bg-card-hover: #19263A;
    --divider-color: #1E2A3A;
    --border-light: rgba(255, 255, 255, 0.08);

    --text-primary: #F8FAFC;
    --text-secondary: #94A3B8;
    --text-faint: #64748B;

    --brand-primary: #38BDF8;
    --brand-primary-blue: #0284C7;
    --brand-gold: #F59E0B;
    --brand-gold-warm: #D4AF37;
    --brand-rose: #EF4444;
    --brand-emerald: #10B981;

    --chip-idle-bg: #1E2A3A;
    --chip-idle-stroke: #334155;
    --chip-idle-text: #CBD5E1;

    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-card: 16px;
    --radius-pill: 9999px;

    --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.35);
    --shadow-glow: 0 0 25px rgba(56, 189, 248, 0.25);
    --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
}

body {
    background-color: var(--bg-main);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    line-height: 1.6;
}

/* Scrollbar */
::-webkit-scrollbar {
    width: 6px;
    height: 6px;
}
::-webkit-scrollbar-track {
    background: var(--bg-main);
}
::-webkit-scrollbar-thumb {
    background: var(--bg-surface);
    border-radius: var(--radius-pill);
}
::-webkit-scrollbar-thumb:hover {
    background: var(--brand-primary-blue);
}

/* ==========================================================================
   HEADER (TOP APP BAR)
   ========================================================================== */
header.app-header {
    position: sticky;
    top: 0;
    z-index: 200;
    background: rgba(11, 19, 31, 0.95);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--divider-color);
    height: 64px;
}

.header-container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 16px;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
}

.brand-section {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: inherit;
    flex-shrink: 0;
}

.brand-logo-img {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    object-fit: cover;
    box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
    border: 1.5px solid var(--brand-primary);
}

.brand-texts {
    display: flex;
    flex-direction: column;
}

.brand-name {
    font-family: 'Cairo', sans-serif;
    font-size: 19px;
    font-weight: 800;
    color: #FFFFFF;
    line-height: 1.1;
}

.brand-tag {
    font-size: 10px;
    color: var(--brand-primary);
    font-weight: 700;
    letter-spacing: 0.5px;
}

/* Desktop Navigation Links */
.header-nav {
    display: flex;
    align-items: center;
    gap: 6px;
}

.nav-link {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: var(--radius-pill);
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    transition: var(--transition);
}

.nav-link:hover {
    color: #FFFFFF;
    background: rgba(255, 255, 255, 0.06);
}

.nav-link.active {
    color: var(--brand-primary);
    background: rgba(56, 189, 248, 0.12);
    font-weight: 700;
}

/* Header Action */
.header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
}

.btn-download-app {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, var(--brand-primary-blue), #0369A1);
    color: #FFFFFF;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: var(--radius-pill);
    font-size: 13.5px;
    font-weight: 700;
    box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
    transition: var(--transition);
    border: 1px solid rgba(255, 255, 255, 0.15);
}

.btn-download-app:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(2, 132, 199, 0.5);
    background: linear-gradient(135deg, #0369A1, var(--brand-primary-blue));
}

.btn-download-app svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
}

/* ==========================================================================
   MAIN 3-COLUMN APP CONTAINER (FACEBOOK / TWITTER STYLE)
   ========================================================================== */
.main-wrapper {
    max-width: 1280px;
    width: 100%;
    margin: 0 auto;
    padding: 16px 16px 40px;
    display: grid;
    grid-template-columns: 280px minmax(0, 680px) 280px;
    gap: 20px;
    align-items: start;
    flex: 1;
}

/* For sub-pages with 2 columns or 1 column */
.main-wrapper.single-column {
    grid-template-columns: minmax(0, 840px);
    justify-content: center;
}

/* Sidebars */
.sidebar {
    position: sticky;
    top: 80px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.sidebar-card {
    background: var(--bg-card);
    border: 1px solid var(--divider-color);
    border-radius: var(--radius-card);
    padding: 16px;
    box-shadow: var(--shadow-card);
}

.sidebar-title {
    font-family: 'Cairo', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: #FFFFFF;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--border-light);
    padding-bottom: 8px;
}

/* Side Menu Links */
.side-menu-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.side-menu-item a {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: var(--radius-md);
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    transition: var(--transition);
}

.side-menu-item a:hover {
    background: var(--bg-surface);
    color: #FFFFFF;
}

.side-menu-item.active a {
    background: rgba(56, 189, 248, 0.12);
    color: var(--brand-primary);
    font-weight: 700;
}

.side-menu-icon {
    font-size: 18px;
    line-height: 1;
}

/* Writer of the Week Spotlight Widget */
.writer-spotlight {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 10px 0;
}

.laurel-avatar-frame {
    position: relative;
    width: 72px;
    height: 72px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.laurel-wreath-img {
    position: absolute;
    inset: -6px;
    width: 84px;
    height: 84px;
    pointer-events: none;
}

.spotlight-avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--brand-gold);
    background: linear-gradient(135deg, var(--brand-primary-blue), var(--brand-primary));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: #FFFFFF;
    font-weight: bold;
}

.spotlight-name {
    font-family: 'Cairo', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: #FFFFFF;
}

.spotlight-badge {
    font-size: 11px;
    color: var(--brand-gold);
    font-weight: 700;
    margin-top: 2px;
}

/* Daily Streak Widget */
.streak-widget {
    background: linear-gradient(135deg, rgba(245, 158, 11, 0.12), rgba(239, 68, 68, 0.08));
    border: 1px solid rgba(245, 158, 11, 0.3);
    border-radius: var(--radius-md);
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.streak-flame {
    font-size: 32px;
    line-height: 1;
    animation: flameBounce 1.5s infinite ease-in-out;
}

@keyframes flameBounce {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
}

.streak-text h4 {
    font-size: 14px;
    color: var(--brand-gold);
    font-family: 'Cairo', sans-serif;
}

.streak-text p {
    font-size: 12px;
    color: var(--text-secondary);
}

/* ==========================================================================
   CENTER FEED (COLONNE PRINCIPALE - 1 POST PAR LIGNE)
   ========================================================================== */
.feed-column {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
}

/* Create Post / Studio Trigger Bar (Like Facebook "بماذا تفكر؟") */
.create-post-box {
    background: var(--bg-card);
    border: 1px solid var(--divider-color);
    border-radius: var(--radius-card);
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow-card);
}

.user-mini-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--brand-primary-blue), var(--brand-primary));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 16px;
    color: #FFFFFF;
    flex-shrink: 0;
}

.create-post-input {
    flex: 1;
    background: var(--bg-surface);
    border: 1px solid var(--divider-color);
    border-radius: var(--radius-pill);
    padding: 10px 18px;
    color: var(--text-secondary);
    font-size: 14px;
    cursor: pointer;
    transition: var(--transition);
}

.create-post-input:hover {
    background: rgba(255, 255, 255, 0.08);
    color: #FFFFFF;
    border-color: var(--brand-primary);
}

.btn-open-studio-header {
    background: rgba(56, 189, 248, 0.12);
    color: var(--brand-primary);
    border: 1px solid rgba(56, 189, 248, 0.3);
    padding: 9px 14px;
    border-radius: var(--radius-pill);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    transition: var(--transition);
}

.btn-open-studio-header:hover {
    background: var(--brand-primary-blue);
    color: #FFFFFF;
}

/* Mood & Category horizontal chips */
.chips-bar-wrapper {
    background: var(--bg-card);
    border: 1px solid var(--divider-color);
    border-radius: var(--radius-card);
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.chips-scroll {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    padding-bottom: 2px;
}

.chips-scroll::-webkit-scrollbar {
    display: none;
}

.chip-item {
    background: var(--chip-idle-bg);
    border: 1px solid var(--chip-idle-stroke);
    color: var(--chip-idle-text);
    padding: 6px 14px;
    border-radius: var(--radius-pill);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: var(--transition);
    user-select: none;
}

.chip-item:hover {
    color: #FFFFFF;
    border-color: var(--brand-primary);
}

.chip-item.active {
    background: linear-gradient(135deg, var(--brand-primary-blue), #0369A1);
    color: #FFFFFF;
    border-color: var(--brand-primary);
    box-shadow: 0 2px 10px rgba(2, 132, 199, 0.35);
}

/* ==========================================================================
   POST CARD (EXACT ITEM_COMMUNITY_POST.XML MATCH)
   ========================================================================== */
.post-item-card {
    background: var(--bg-card);
    border: 1px solid var(--divider-color);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: var(--transition);
}

.post-item-card:hover {
    border-color: rgba(56, 189, 248, 0.35);
}

/* Post Header */
.card-author-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 8px;
}

.author-profile-link {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: inherit;
}

.author-avatar-box {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--brand-primary-blue), var(--brand-primary));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 16px;
    color: #FFFFFF;
    border: 1.5px solid var(--divider-color);
    flex-shrink: 0;
}

.author-name-col {
    display: flex;
    flex-direction: column;
}

.author-name-row {
    display: flex;
    align-items: center;
    gap: 6px;
}

.author-name-text {
    font-family: 'Cairo', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
}

.author-badge-pill {
    font-size: 11px;
    line-height: 1;
}

.author-streak-badge {
    font-size: 11px;
    line-height: 1;
}

.author-meta-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    color: var(--text-secondary);
    margin-top: 1px;
}

.btn-card-menu {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 6px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.btn-card-menu:hover {
    background: rgba(255, 255, 255, 0.08);
    color: #FFFFFF;
}

/* Inner Quote Card (layoutPostCard) */
.inner-quote-card {
    margin: 6px 12px;
    padding: 24px 20px;
    border-radius: var(--radius-md);
    background: #0f172a;
    border: 1px solid rgba(255, 255, 255, 0.05);
    min-height: 150px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    position: relative;
    cursor: pointer;
    user-select: none;
}

.quote-body-text {
    font-size: 18.5px;
    line-height: 1.85;
    color: var(--text-primary);
    word-break: break-word;
    white-space: pre-line;
    text-align: center;
}

/* Double click heart animation */
.heart-pop {
    position: absolute;
    width: 80px;
    height: 80px;
    fill: var(--brand-rose);
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    pointer-events: none;
}

.heart-pop.active {
    opacity: 1;
    transform: scale(1.2);
}

/* Hashtag row */
.card-tag-row {
    padding: 6px 16px 2px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.tag-badge-link {
    color: var(--brand-primary);
    font-size: 12.5px;
    font-weight: 700;
    text-decoration: none;
}

.tag-badge-link:hover {
    text-decoration: underline;
}

/* Card Bottom Action Bar */
.card-action-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 48px;
    padding: 0 14px;
    border-top: 1px solid var(--border-light);
    margin-top: 6px;
}

.action-bar-left, .action-bar-right {
    display: flex;
    align-items: center;
    gap: 4px;
}

.card-action-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
}

.card-action-btn:hover {
    background: rgba(255, 255, 255, 0.08);
    color: #FFFFFF;
}

.card-action-btn.liked {
    color: var(--brand-rose);
}

.card-action-btn.bookmarked {
    color: var(--brand-gold);
}

.card-action-btn svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
}

.card-action-btn.liked svg {
    fill: var(--brand-rose);
    stroke: var(--brand-rose);
}

.card-action-btn.bookmarked svg {
    fill: var(--brand-gold);
    stroke: var(--brand-gold);
}

/* Collapsible Comments Section */
.card-comments-drawer {
    display: none;
    border-top: 1px solid var(--border-light);
    background: rgba(11, 19, 31, 0.4);
    padding: 16px;
}

.card-comments-drawer.open {
    display: block;
}

.comment-input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
}

.comment-text-box {
    flex: 1;
    background: var(--bg-surface);
    border: 1px solid var(--divider-color);
    border-radius: var(--radius-md);
    padding: 8px 14px;
    color: var(--text-primary);
    font-size: 13.5px;
    outline: none;
}

.comment-text-box:focus {
    border-color: var(--brand-primary);
}

.btn-send-comment {
    background: var(--brand-primary-blue);
    border: none;
    color: #FFFFFF;
    padding: 0 16px;
    border-radius: var(--radius-md);
    cursor: pointer;
    font-weight: 700;
    font-size: 13px;
}

.comments-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.comment-item {
    background: var(--bg-card);
    border: 1px solid var(--divider-color);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
}

.comment-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
    font-size: 12px;
}

.comment-author-name {
    font-weight: 700;
    color: var(--brand-primary);
}

.comment-time {
    color: var(--text-faint);
}

.comment-content {
    font-size: 13px;
    color: var(--text-primary);
}

/* AdSense In-feed Placement */
.feed-adsense-slot {
    background: rgba(19, 29, 46, 0.5);
    border: 1px dashed var(--divider-color);
    border-radius: var(--radius-card);
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 180px;
    color: var(--text-faint);
}

.feed-adsense-slot span {
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 6px;
}

/* ==========================================================================
   MOBILE BOTTOM NAVIGATION BAR (PHOTOCOPY OF ANDROID APP)
   ========================================================================== */
.mobile-bottom-nav {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 60px;
    background: rgba(11, 19, 31, 0.98);
    backdrop-filter: blur(16px);
    border-top: 1px solid var(--divider-color);
    z-index: 200;
    align-items: center;
    justify-content: space-around;
}

.bottom-nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    text-decoration: none;
    color: var(--text-secondary);
    font-size: 11px;
    font-weight: 600;
    flex: 1;
    height: 100%;
}

.bottom-nav-item.active {
    color: var(--brand-primary);
    font-weight: 700;
}

.bottom-nav-item svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
}

/* ==========================================================================
   PAGES CONTENT (ABOUT, CONTACT, CATEGORIES, WRITERS)
   ========================================================================== */
.page-container {
    background: var(--bg-card);
    border: 1px solid var(--divider-color);
    border-radius: var(--radius-card);
    padding: 32px 24px;
    box-shadow: var(--shadow-card);
}

.page-header {
    text-align: center;
    border-bottom: 1px solid var(--divider-color);
    padding-bottom: 24px;
    margin-bottom: 28px;
}

.page-title {
    font-family: 'Cairo', sans-serif;
    font-size: 28px;
    font-weight: 800;
    color: #FFFFFF;
    margin-bottom: 8px;
}

.page-subtitle {
    font-size: 15px;
    color: var(--brand-primary);
}

.page-content p {
    margin-bottom: 16px;
    font-size: 15.5px;
    line-height: 1.8;
    color: var(--text-secondary);
}

.page-content h2 {
    font-family: 'Cairo', sans-serif;
    font-size: 20px;
    font-weight: 700;

    <!-- Studio Canvas Logic -->
    <script>
        const canvas = document.getElementById("webStudioCanvas");
        const ctx = canvas.getContext("2d");
        const textInput = document.getElementById("studioTextInput");
        const authorInput = document.getElementById("studioAuthorInput");
        const fontSelect = document.getElementById("studioFontSelect");
        const fontSizeRange = document.getElementById("studioFontSizeRange");
        const fontSizeDisplay = document.getElementById("fontSizeDisplay");
        const btnDownload = document.getElementById("btnDownload");
        const canvasDimsBadge = document.getElementById("canvasDimsBadge");

        let currentRatio = "1:1";
        let currentGradient = { from: "#0B0F19", to: "#1E293B" };
        let currentBorder = "#EAB308";
        let currentBgId = "card_luxury";

        const randomQuotesSample = [
            { text: "الخوف لا يمنع من الموت، ولكنه يمنع من الحياة.", author: "نجيب محفوظ" },
            { text: "سنصير يوماً ما نريد، لا رحلة تبتدئ ولا درب ينتهي.", author: "محمود درويش" },
            { text: "إذا لم تزد شيئاً على الدنيا، كنتَ أنتَ زائداً عليها.", author: "مصطفى صادق الرافعي" },
            { text: "دع الأيام تفعل ما تشاءُ وطب نفساً إذا حكم القضاءُ.", author: "الإمام الشافعي" }
        ];

        function setStudioRatio(ratio) {
            currentRatio = ratio;
            document.getElementById("btnRatioSquare").classList.toggle("active", ratio === "1:1");
            document.getElementById("btnRatioStory").classList.toggle("active", ratio === "9:16");

            if (ratio === "1:1") {
                canvas.width = 1080;
                canvas.height = 1080;
                canvasDimsBadge.innerText = "1080 × 1080 (مربع)";
            } else {
                canvas.width = 1080;
                canvas.height = 1920;
                canvasDimsBadge.innerText = "1080 × 1920 (ستوري 9:16)";
            }
            redrawCanvas();
        }

        function redrawCanvas() {
            const w = canvas.width;
            const h = canvas.height;
            const text = textInput.value.trim() || "اكتب خاطرتك هنا...";
            const author = authorInput.value.trim() || "كاتب منشوراتي";
            const fontName = fontSelect.value;
            const fontSize = parseInt(fontSizeRange.value);

            // 1. Background
            const grad = ctx.createLinearGradient(0, 0, w, h);
            grad.addColorStop(0, currentGradient.from);
            grad.addColorStop(1, currentGradient.to);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            // Frame borders (Signature Android App Frame)
            ctx.strokeStyle = currentBorder || "rgba(255, 255, 255, 0.12)";
            ctx.lineWidth = 14;
            ctx.strokeRect(36, 36, w - 72, h - 72);

            // Brand Watermark
            ctx.font = "bold 34px 'Cairo', sans-serif";
            ctx.fillStyle = "#38BDF8";
            ctx.textAlign = "center";
            ctx.fillText("منشوراتي • MANCHORATI", w / 2, currentRatio === "1:1" ? 110 : 180);

            // Quote Symbol
            ctx.font = "bold 90px 'Amiri', serif";
            ctx.fillStyle = "rgba(56, 189, 248, 0.4)";
            ctx.fillText("«", w / 2, currentRatio === "1:1" ? 280 : 420);

            // Main Quote Text
            ctx.fillStyle = "#FFFFFF";
            ctx.font = `600 ${fontSize}px '${fontName}', sans-serif`;
            const startY = currentRatio === "1:1" ? 380 : 650;
            const lineHeight = fontSize * 1.55;
            wrapText(ctx, text, w / 2, startY, w - 240, lineHeight);

            // Author Name
            ctx.font = "bold 38px 'Cairo', sans-serif";
            ctx.fillStyle = "#F59E0B";
            const authorY = currentRatio === "1:1" ? h - 160 : h - 280;
            ctx.fillText(`— ${author}`, w / 2, authorY);

            // Bottom Domain
            ctx.font = "400 22px 'Tajawal', sans-serif";
            ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
            ctx.fillText("صمم عبر تطبيق منشوراتي • manchorati.com", w / 2, h - 80);
        }

        function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            const words = text.split(" ");
            let line = "";
            let currentY = y;
            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + " ";
                const metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && n > 0) {
                    ctx.fillText(line.trim(), x, currentY);
                    line = words[n] + " ";
                    currentY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line.trim(), x, currentY);
        }

        function loadRandomStudioQuote() {
            const q = randomQuotesSample[Math.floor(Math.random() * randomQuotesSample.length)];
            textInput.value = q.text;
            authorInput.value = q.author;
            redrawCanvas();
        }

        // Palette click
        document.querySelectorAll(".palette-item").forEach(item => {
            item.addEventListener("click", () => {
                document.querySelectorAll(".palette-item").forEach(p => p.classList.remove("active"));
                item.classList.add("active");
                currentGradient = {
                    from: item.getAttribute("data-from"),
                    to: item.getAttribute("data-to")
                };
                currentBorder = item.getAttribute("data-border") || "rgba(255, 255, 255, 0.12)";
                currentBgId = item.getAttribute("data-bgid") || "card_luxury";
                redrawCanvas();
            });
        });

        textInput.addEventListener("input", redrawCanvas);
        authorInput.addEventListener("input", redrawCanvas);
        fontSelect.addEventListener("change", redrawCanvas);
        fontSizeRange.addEventListener("input", (e) => {
            fontSizeDisplay.innerText = `${e.target.value}px`;
            redrawCanvas();
        });

        btnDownload.addEventListener("click", () => {
            const link = document.createElement("a");
            link.download = `manchorati_card_${Date.now()}.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();
        });

        const btnPublish = document.getElementById("btnPublishCommunity");
        if (btnPublish) {
            btnPublish.addEventListener("click", () => {
                const text = textInput.value.trim();
                if (!text) {
                    alert("الرجاء كتابة نص الاقتباس أولاً");
                    return;
                }
                const author = authorInput.value.trim() || "كاتب منشوراتي";
                const userPosts = JSON.parse(localStorage.getItem("manchorati_user_posts") || "[]");
                const newPost = {
                    id: 'studio-' + Date.now(),
                    authorName: author,
                    authorUsername: 'my_profile',
                    authorPhotoUrl: '',
                    authorBadge: 'مصمم الاستوديو 🎨',
                    authorStreak: 4,
                    content: text,
                    bgId: currentBgId || 'card_luxury',
                    fontId: fontSelect.value.toLowerCase(),
                    textColor: '#FFFFFF',
                    tag: 'تصميم الاستوديو',
                    mood: 'CHILL',
                    likesCount: 1,
                    commentsCount: 0,
                    timestamp: Date.now()
                };
                userPosts.unshift(newPost);
                localStorage.setItem("manchorati_user_posts", JSON.stringify(userPosts));
                window.location.href = "index.html";
            });
        }

        window.addEventListener("DOMContentLoaded", () => {
            // Check URL param ?text= or ?quote=
            const urlParams = new URLSearchParams(window.location.search);
            const quoteText = urlParams.get("text") || urlParams.get("quote");
            const author = urlParams.get("author");
            const bg = urlParams.get("bg");
            if (quoteText) textInput.value = quoteText;
            if (author) authorInput.value = author;
            if (bg) {
                const targetP = document.querySelector(`.palette-item[data-bgid='${bg}']`);
                if (targetP) targetP.click();
            }
            redrawCanvas();
        });
    </script>
</body>
</html>
