<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="45%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#16253B"/>
      <stop offset="45%" stop-color="#0D1624"/>
      <stop offset="85%" stop-color="#070C14"/>
      <stop offset="100%" stop-color="#04070B"/>
    </radialGradient>

    <!-- Outer Beveled Squircle Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#D4AF37" stop-opacity="0.7"/>
      <stop offset="65%" stop-color="#38BDF8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Inner Hairline Border Gradient -->
    <linearGradient id="innerBorderGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Ambient Core Glows -->
    <radialGradient id="cyanCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="goldAmbientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D Gold Ribbon Gradient (Meem Front Facet) -->
    <linearGradient id="goldRibbonFront" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="15%" stop-color="#FEF08A"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="88%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

    <!-- 3D Gold Ribbon Bevel Highlight -->
    <linearGradient id="goldBevelHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FDE047" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Cyan Inner Underside Gradient (Meem Interior Ribbon) -->
    <linearGradient id="cyanRibbonInner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#082F49"/>
      <stop offset="35%" stop-color="#0284C7"/>
      <stop offset="75%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>

    <!-- Cyan Crystal Feather Vane Gradient -->
    <linearGradient id="crystalVaneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#7DD3FC" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.75"/>
      <stop offset="90%" stop-color="#0369A1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#082F49" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Golden Feather Spine Gradient -->
    <linearGradient id="featherSpineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="20%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="80%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Glowing Nib Gradient -->
    <linearGradient id="nibGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Stardust Arc Glow Gradient -->
    <linearGradient id="stardustArcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#7DD3FC" stop-opacity="0.65"/>
      <stop offset="85%" stop-color="#FEF08A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadows and Glow Filters -->
    <filter id="shadowHeavy" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#020617" flood-opacity="0.85"/>
    </filter>

    <filter id="shadowMedium" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.7"/>
    </filter>

    <filter id="cyanGlowEffect" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="goldGlowEffect" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Squircle Clip for Inner Sheen -->
    <clipPath id="squircleClip">
      <path d="M 132,28 C 58,28 28,58 28,132 L 28,380 C 28,454 58,484 132,484 L 380,484 C 454,484 484,454 484,380 L 484,132 C 484,58 454,28 380,28 Z"/>
    </clipPath>
  </defs>

  <!-- ==================== LAYER 1: SQUIRCLE TILE BASE ==================== -->
  <!-- Outer Soft Shadow -->
  <path d="M 132,32 C 58,32 28,62 28,136 L 28,384 C 28,458 58,488 132,488 L 380,488 C 454,488 484,458 484,384 L 484,136 C 484,62 454,32 380,32 Z"
        fill="#000000" opacity="0.6" filter="url(#shadowHeavy)"/>

  <!-- Main Squircle Background -->
  <path d="M 132,28 C 58,28 28,58 28,132 L 28,380 C 28,454 58,484 132,484 L 380,484 C 454,484 484,454 484,380 L 484,132 C 484,58 454,28 380,28 Z"
        fill="url(#bgGlow)"/>

  <!-- Double Beveled Rim (Outer Gold-to-Cyan Frame) -->
  <path d="M 132,28 C 58,28 28,58 28,132 L 28,380 C 28,454 58,484 132,484 L 380,484 C 454,484 484,454 484,380 L 484,132 C 484,58 454,28 380,28 Z"
        fill="none" stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- Inner Hairline Border -->
  <path d="M 136,36 C 66,36 36,66 36,136 L 36,376 C 36,446 66,476 136,476 L 376,476 C 446,476 476,446 476,376 L 476,136 C 476,66 446,36 376,36 Z"
        fill="none" stroke="url(#innerBorderGrad)" stroke-width="1.2"/>

  <!-- Subtle Editorial Top-Glass Reflection -->
  <g clip-path="url(#squircleClip)">
    <path d="M 28,28 L 484,28 L 484,180 L 28,80 Z" fill="#FFFFFF" opacity="0.03"/>
    <circle cx="210" cy="270" r="140" fill="url(#cyanCoreGlow)"/>
    <circle cx="330" cy="190" r="130" fill="url(#goldAmbientGlow)"/>
  </g>

  <!-- ==================== LAYER 2: KINETIC STARDUST TRAIL ==================== -->
  <g id="stardustTrail" filter="url(#cyanGlowEffect)">
    <!-- Swirling Stardust Arc -->
    <path d="M 125,370 C 120,290 155,200 230,155 C 300,115 385,135 415,190"
          fill="none" stroke="url(#stardustArcGrad)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="1 8" opacity="0.85"/>
    <path d="M 140,360 C 135,295 165,215 235,170 C 295,130 375,145 405,195"
          fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

    <!-- Sparkling Diamond Stars -->
    <!-- Star 1 -->
    <path d="M 155,250 Q 155,242 151,242 Q 155,242 155,234 Q 155,242 159,242 Q 155,242 155,250 Z" fill="#E0F2FE" opacity="0.9"/>
    <!-- Star 2 -->
    <path d="M 215,160 Q 215,152 211,152 Q 215,152 215,144 Q 215,152 219,152 Q 215,152 215,160 Z" fill="#FEF08A" opacity="0.95"/>
    <!-- Star 3 -->
    <path d="M 380,145 Q 380,138 376,138 Q 380,138 380,131 Q 380,138 384,138 Q 380,138 380,145 Z" fill="#7DD3FC" opacity="0.85"/>
    <!-- Star 4 -->
    <path d="M 425,225 Q 425,219 421,219 Q 425,219 425,213 Q 425,219 429,219 Q 425,219 425,225 Z" fill="#FDE047" opacity="0.9"/>
    
    <!-- Micro Particles -->
    <circle cx="135" cy="315" r="2" fill="#38BDF8" opacity="0.8"/>
    <circle cx="178" cy="205" r="2.5" fill="#FEF08A" opacity="0.9"/>
    <circle cx="265" cy="140" r="2" fill="#7DD3FC" opacity="0.75"/>
    <circle cx="340" cy="130" r="3" fill="#FDE047" opacity="0.85"/>
    <circle cx="410" cy="165" r="1.8" fill="#BAE6FD" opacity="0.7"/>
    <circle cx="435" cy="255" r="2.2" fill="#38BDF8" opacity="0.6"/>
  </g>

  <!-- ==================== LAYER 3: 3D ARABIC CALLIGRAPHY MEEM (م) ==================== -->
  <g id="arabicLetterMeem" filter="url(#shadowHeavy)">
    <!-- Underside Ribbon Shadow (Depth Anchor) -->
    <path d="M 240,240 C 275,255 310,290 320,340 C 330,390 315,445 285,465 C 270,475 255,475 250,460 C 265,440 280,395 270,350 C 260,310 230,275 200,260 Z"
          fill="#020617" opacity="0.55"/>

    <!-- 1. Interior Ribbon Curl (Cyan / Digital Soul - Fold of the Loop) -->
    <path d="M 195,210 C 215,185 250,185 270,210 C 285,230 280,265 255,285 C 230,300 195,295 180,270 C 170,250 175,225 195,210 Z"
          fill="url(#cyanRibbonInner)"/>

    <!-- Inner Eye of the Meem (فجوة الميم) -->
    <ellipse cx="230" cy="245" rx="26" ry="24" fill="#070D16" opacity="0.95"/>
    <ellipse cx="230" cy="245" rx="26" ry="24" fill="none" stroke="#0284C7" stroke-width="2" opacity="0.6"/>

    <!-- 2. Main 3D Sculptural Ribbon (Champagne Gold Facet) -->
    <!-- The Loop and Descending Tail of the Meem -->
    <path d="M 175,225 C 190,165 270,160 305,200 C 335,235 335,285 295,325 C 265,355 240,365 240,395 C 240,430 260,455 280,470 C 270,475 250,475 235,460 C 215,435 210,390 220,355 C 230,325 255,310 275,285 C 295,260 295,230 275,210 C 255,190 205,195 190,235 C 180,260 185,285 175,305 C 168,285 165,255 175,225 Z"
          fill="url(#goldRibbonFront)"/>

    <!-- 3. Ribbon Bevel Edge Highlight (Liquid Metal Sheen) -->
    <path d="M 175,225 C 190,165 270,160 305,200 C 335,235 335,285 295,325 C 265,355 240,365 240,395 C 240,430 260,455 280,470"
          fill="none" stroke="url(#goldBevelHighlight)" stroke-width="3" stroke-linecap="round"/>

    <!-- Inner Bevel Crest -->
    <path d="M 235,460 C 215,435 210,390 220,355 C 230,325 255,310 275,285 C 295,260 295,230 275,210 C 255,190 205,195 190,235"
          fill="none" stroke="#FEF08A" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>

    <!-- 4. Zakhrafa / Arabesque Filigree Engraving on the Meem -->
    <g id="zakhrafaFlourish" stroke="#FEF08A" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6">
      <!-- Spiral Motif on the Meem Head -->
      <path d="M 265,185 C 280,180 295,195 285,210 C 278,220 265,215 268,205 C 270,198 278,200 277,204"/>
      <!-- Arabesque Palmette Leaf Motif -->
      <path d="M 298,225 C 310,235 315,250 305,265 C 300,270 292,265 295,258 C 298,250 308,252 305,245"/>
      <!-- Graceful Scroll along the Tail -->
      <path d="M 245,365 C 255,380 252,400 240,415 C 235,420 228,415 232,408 C 235,400 245,402 242,392"/>
      <!-- Dot Accents -->
      <circle cx="282" cy="195" r="1.5" fill="#FFFBEB"/>
      <circle cx="304" cy="245" r="1.5" fill="#FFFBEB"/>
      <circle cx="242" cy="385" r="1.5" fill="#FFFBEB"/>
    </g>
  </g>

  <!-- ==================== LAYER 4: LUXURY 3D QUILL FOUNTAIN PEN ==================== -->
  <g id="luxuryQuillPen" filter="url(#shadowMedium)">
    <!-- Main Transform: Diagonal Dynamic Alignment 42deg -->
    <g transform="rotate(-42, 275, 240)">

      <!-- Feather Back-Vane (Bottom Flange in Cyan Crystal) -->
      <path d="M 275,80 C 240,110 225,160 230,220 C 232,245 240,265 255,285 L 268,280 C 258,255 250,230 252,195 C 255,150 268,110 275,80 Z"
            fill="url(#crystalVaneGrad)" opacity="0.9"/>
      
      <!-- Crystal Facet Lines (Bottom Vane) -->
      <path d="M 240,140 L 260,165 M 235,185 L 255,205 M 240,230 L 258,245"
            stroke="#BAE6FD" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>

      <!-- Feather Front-Vane (Top Flange in Segmented Cyan Glass) -->
      <path d="M 275,80 C 310,105 325,150 320,205 C 318,230 310,250 295,270 L 282,265 C 292,245 300,220 298,190 C 295,145 285,110 275,80 Z"
            fill="url(#crystalVaneGrad)" opacity="0.95"/>

      <!-- Crystal Facet Lines (Top Vane) -->
      <path d="M 310,135 L 290,160 M 315,180 L 295,200 M 305,225 L 288,240"
            stroke="#E0F2FE" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>

      <!-- Feather Vane Natural Barb Notches -->
      <path d="M 318,155 L 305,165 M 312,210 L 298,220 M 230,170 L 245,180"
            stroke="#082F49" stroke-width="1.5" opacity="0.6"/>

      <!-- Central Golden Spine / Rachis (3D Ridged Axis) -->
      <!-- Spine Base Shadow -->
      <path d="M 272,75 L 280,75 L 278,295 L 270,295 Z" fill="#451A03" opacity="0.6"/>
      <!-- Spine Golden Highlight -->
      <path d="M 273,75 L 277,75 L 275,295 L 271,295 Z" fill="url(#featherSpineGrad)"/>
      <line x1="274" y1="75" x2="274" y2="295" stroke="#FFFBEB" stroke-width="1.2" stroke-linecap="round"/>

      <!-- Ornate Gold Filigree Collar / Ferrule (Between Feather & Grip) -->
      <rect x="264" y="295" width="22" height="12" rx="3" fill="url(#featherSpineGrad)"/>
      <rect x="266" y="297" width="18" height="8" rx="2" fill="none" stroke="#FEF08A" stroke-width="0.8"/>
      <circle cx="275" cy="301" r="2" fill="#38BDF8"/>

      <!-- Sculpted Pen Barrel / Grip (With Arabesque Texture) -->
      <path d="M 266,307 L 284,307 L 281,345 L 269,345 Z" fill="url(#goldRibbonFront)"/>
      <!-- Grip Rings & Diamond Knurling -->
      <line x1="267" y1="315" x2="283" y2="315" stroke="#78350F" stroke-width="1"/>
      <line x1="268" y1="325" x2="282" y2="325" stroke="#78350F" stroke-width="1"/>
      <line x1="268" y1="335" x2="282" y2="335" stroke="#78350F" stroke-width="1"/>
      <path d="M 270,310 L 280,340 M 280,310 L 270,340" stroke="#FEF08A" stroke-width="0.8" opacity="0.6"/>

      <!-- Gold Nib Section / Collar -->
      <path d="M 269,345 L 281,345 L 279,358 L 271,358 Z" fill="url(#featherSpineGrad)"/>

      <!-- Calligraphy Fountain Nib (Mirror-Polished Gold + Cyan Glowing Tip) -->
      <path d="M 271,358 C 271,365 264,385 273,405 L 275,412 L 277,405 C 286,385 279,365 279,358 Z"
            fill="url(#nibGrad)"/>

      <!-- Nib Bevel & Slit Detail -->
      <line x1="275" y1="365" x2="275" y2="410" stroke="#082F49" stroke-width="1"/>
      <circle cx="275" cy="378" r="2" fill="#082F49"/>
      <circle cx="275" cy="378" r="1.2" fill="#38BDF8"/>
      <!-- Nib Side Highlights -->
      <path d="M 271,360 C 271,372 266,388 274,408" fill="none" stroke="#FFFBEB" stroke-width="1" opacity="0.8"/>
      <path d="M 279,360 C 279,372 284,388 276,408" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.85"/>
      
      <!-- Radiant Nib Emission Point (The Touchpoint of Creation) -->
      <circle cx="275" cy="411" r="3.5" fill="#E0F2FE" filter="url(#cyanGlowEffect)"/>
      <circle cx="275" cy="411" r="1.5" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- ==================== LAYER 5: SPECULAR LENS FLARE & GLINTS ==================== -->
  <g id="specularGlints">
    <!-- Diamond Glint at Nib Contact -->
    <path d="M 198,284 Q 198,272 192,272 Q 198,272 198,260 Q 198,272 204,272 Q 198,272 198,284 Z"
          fill="#FFFFFF" filter="url(#cyanGlowEffect)"/>
    
    <!-- Diamond Glint on Golden Feather Tip -->
    <path d="M 374,96 Q 374,86 369,86 Q 374,86 374,76 Q 374,86 379,86 Q 374,86 374,96 Z"
          fill="#FFFDF0" filter="url(#goldGlowEffect)"/>

    <!-- Subtle Cyan Ambient Flecks -->
    <circle cx="205" cy="265" r="1.5" fill="#FFFFFF"/>
    <circle cx="365" cy="115" r="1.5" fill="#FEF08A"/>
    <circle cx="295" cy="175" r="2" fill="#BAE6FD" opacity="0.85"/>
  </g>
</svg>
